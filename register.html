<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f6f8ff;">
    

    <!-- start regestar home -->
     <header class="register-home mt-5 pt-10">

        <div class="container">
            <div class="row">

                <div class="md:col-6">
                    <img src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75">
                </div>

                <div class="md:col-6">
                    <h3>Creat account</h3>
                    <p class="fg-secondary">Go ahead and sign up , let everyone<br> know how awesome you are! </p>
                    <h5 class="result "></h5>
                    <form onsubmit="return collectionOfdata()" action="success.html " method="post">

                        <input id="user" type="text" name="user" placeholder="User name" class="form-control mt-5 p-4 rounded-2" >

                        <input id="email"  type="email" name="email" placeholder="Email" class="form-control mt-5 p-4 rounded-2">

                        <input id="pass" type="password" name="password" placeholder="password" class="form-control mt-5 p-4 rounded-2">
                        
                        <input id="confirm" type="password" name="confirm pass" placeholder="confirm pass" class="form-control mt-5 p-4 rounded-2">

                        <input type="submit" value="Creat New Account" class="form-control mt-5 p-4 rounded-2 theme-primary btn-solid d-block w-100">

                    </form>
                </div>
            </div>
        </div>







     </header>



    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
